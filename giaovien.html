<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trang giáo viên – Thống kê kết quả</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a37;--line:#2b2250;--soft:#eef3f1;--pri:#0e6b60;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#22262e;--ink:#eef1f5;--line:#8f9bb0;--soft:#2c323c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--card:#22262e;--ink:#eef1f5;--line:#8f9bb0;--soft:#2c323c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:18px;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding:12px}h1,h2{margin:.3em 0}h1{font-size:1.5rem}h2{font-size:1.2rem;margin-top:1.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{justify-content:space-between}
.btn{font:inherit;font-size:.85rem;font-weight:bold;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:7px 14px;cursor:pointer}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
input,select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.tc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:10px 0}
.sc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--pri);border-radius:12px;padding:10px 14px}.sn{font-size:2rem;font-weight:bold}.sn small{font-size:1rem;font-weight:normal}
.mut{font-size:.8rem;opacity:.75}.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.gb{display:flex;align-items:center;gap:6px;margin:3px 0}.gb span{display:block;height:16px;border-radius:0 6px 6px 0}.gb b{font-size:.75rem}.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin:0 4px 0 10px}
table{border-collapse:collapse;width:100%}th{font-size:.75rem;text-align:left;opacity:.7;letter-spacing:.04em}td,th{border-bottom:1px solid var(--soft);padding:6px 6px;vertical-align:top}.wrap{overflow-x:auto}
.chip{background:#ffe8b0;color:#6b4a00;border-radius:8px;padding:1px 8px;margin:2px;display:inline-block;font-size:.8rem}.err{color:#d6453d;font-weight:bold}
</style></head><body><div id="app"></div>
<script>
// Dán đường dẫn Web App (kết thúc bằng /exec) vào đây, hoặc nhập ngay trên trang (chỉ lưu trên máy này).
const GAS_URL='https://script.google.com/macros/s/AKfycbyJfr51giqN6g8eAEyWnA0WCbb0z8PzhG6T-1f4aT-HZgfq9tPNWl9zUisNcivjqSfujw/exec';
const DN=['','Góc đặc biệt & Tia phân giác','Dấu hiệu nhận biết song song','Tiên đề Euclid & Tính chất','Định lí, GT-KL & Chứng minh','Tổng hợp & Thực tế'];
const TIP=['','Ôn: kề bù (tổng 180°), đối đỉnh (bằng nhau), tia phân giác chia đôi góc.','Ôn: một cặp so le trong hoặc đồng vị bằng nhau, hoặc trong cùng phía bù nhau thì suy ra song song.','Ôn: tiên đề Euclid; khi a // b thì so le trong và đồng vị bằng nhau, trong cùng phía bù nhau.','Ôn: giả thiết là phần sau “Nếu”, kết luận là phần sau “thì”; sắp xếp các bước chứng minh theo logic.','Ôn: kẻ đường phụ song song, chia nhỏ bài toán rồi cộng hoặc trừ góc.'];
const CC=['#cc4b44','#0e6b60','#d99a1e','#4b6fcc','#8a4bcc','#2d9d78'];
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const url=()=>ld('gv_url','')||GAS_URL;
let DATA=[],CF='',CLS=[],TT='',ST='',AUTO=ld('gv_auto',true),timer=null,BUSY=false;
async function load(){const u=url();if(!u){ST='Hãy nhập đường dẫn Web App và mật khẩu ở phần Cài đặt bên dưới.';return render()}
if(BUSY)return;BUSY=true;ST='Đang tải…';render();
try{const r=await fetch(u+(u.includes('?')?'&':'?')+'mk='+encodeURIComponent(ld('gv_pw',''))+'&t='+Date.now()),a=await r.json();
if(a&&a.error){ST='⚠ '+a.error}else{DATA=Array.isArray(a)?a:[];TT=new Date().toLocaleTimeString('vi-VN');ST=''}}
catch(e){ST='⚠ Không tải được kết quả. Kiểm tra đường dẫn Web App (quyền “Bất kỳ ai”) và kết nối mạng.'}
BUSY=false;render()}
function setAuto(v){AUTO=v;sv('gv_auto',v);clearInterval(timer);if(v)timer=setInterval(()=>{if(!document.hidden&&document.activeElement.tagName!='INPUT')load()},60000)}
function saveCfg(){sv('gv_url',$('#gu').value.trim());sv('gv_pw',$('#gp').value);load()}
function setSz(i,v){const z=ld('gv_sz',{});z[CLS[i]]=Math.max(0,+v||0);sv('gv_sz',z);render()}
const fix=r=>Object.assign({},r,{right:r.right||{},wrong:r.wrong||{}});
const nq=r=>[1,2,3,4,5].reduce((s,d)=>s+(r.right[d]||0)+(r.wrong[d]||0),0);
const rt=(L,d)=>{const w=L.reduce((s,r)=>s+(r.wrong[d]||0),0),t=w+L.reduce((s,r)=>s+(r.right[d]||0),0);return t?Math.round(w/t*100):0};
function csv(){const A=DATA.map(fix),h=['Họ tên','Lớp','Cấp','Sao','XP','Ải đạt','Hoàn thành 4 ải','Số câu đã làm','% sai D1','% sai D2','% sai D3','% sai D4','% sai D5'];
const rows=A.map(r=>[r.name,r.cls,r.lv||'',r.stars||0,r.xp||0,r.done||0,r.all?'Có':'Chưa',nq(r),...[1,2,3,4,5].map(d=>rt([r],d))]);
const s=[h,...rows].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');
a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));a.download='ket_qua_chuong3.csv';a.click()}
function render(){const A=DATA.map(fix),SZ=ld('gv_sz',{});CLS=[...new Set(A.map(r=>r.cls))].sort();
const cl=CF?CLS.filter(c=>c==CF):CLS,fl=A.filter(r=>!CF||r.cls==CF),col=c=>CC[CLS.indexOf(c)%CC.length];
const tot=cl.reduce((s,c)=>s+(+SZ[c]||0),0),pl=fl.length,fin=fl.filter(r=>r.all).length,qs=fl.reduce((s,r)=>s+nq(r),0),ord=[1,2,3,4,5].sort((a,b)=>rt(fl,b)-rt(fl,a));
const cards=`<div class="tc"><div class="sc"><span class="sn">${pl}${tot?'<small>/'+tot+'</small>':''}</span> em<div class="mut">đã chơi${tot?` (${Math.round(pl/tot*100)}% ${cl.length} lớp)`:' · hãy nhập sĩ số từng lớp'}</div></div><div class="sc"><span class="sn">${qs.toLocaleString('vi-VN')}</span><div class="mut">câu hỏi các em đã tự làm</div></div><div class="sc"><span class="sn">${fin}</span> em<div class="mut">đã đi hết cả 4/4 ải</div></div></div>`;
const cc=`<div class="tc">${cl.map(c=>{const s=A.filter(r=>r.cls==c),z=+SZ[c]||0,q=s.reduce((t,r)=>t+nq(r),0),i=CLS.indexOf(c);return`<div class="sc" style="border-top-color:${col(c)}"><span class="sn" style="font-size:1.4rem">${esc(c)}</span> <b>${s.length}${z?'/'+z:''} em</b> đã chơi · ${q} câu<div class="bar"><i style="width:${z?Math.min(100,s.length/z*100):100}%;background:${col(c)}"></i></div><span class="mut">sĩ số <input type="number" min="0" style="width:4.5rem" value="${z||''}" onchange="setSz(${i},this.value)"></span></div>`}).join('')}</div>`;
const chart=cl.length?`<div class="card"><div class="row sp"><b>Năm dạng bài, tính theo % câu làm sai</b><span>${cl.map(c=>`<span class="mut"><i class="dot" style="background:${col(c)}"></i>${esc(c)}</span>`).join('')}</span></div>${ord.map(d=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap;margin:8px 0"><div style="flex:0 0 36%;text-align:right;font-size:.85rem">${DN[d]}</div><div style="flex:1">${cl.map(c=>{const p=rt(A.filter(r=>r.cls==c),d);return`<div class="gb"><span style="width:${Math.max(p,1)}%;background:${col(c)}"></span><b>${p}%</b></div>`}).join('')}</div></div>`).join('')}</div>`:'<div class="card">Chưa có dữ liệu. Khi học sinh chơi xong, kết quả sẽ tự hiện ở đây.</div>';
const sup=`<div class="card wrap"><table><tr><th>DẠNG BÀI</th><th>CẦN HỖ TRỢ</th></tr>${ord.map(d=>{const n=fl.filter(r=>(r.wrong[d]||0)>=2&&(r.wrong[d]||0)/((r.wrong[d]||0)+(r.right[d]||0))>=.4);return`<tr><td>${DN[d]}<div class="mut">${rt(fl,d)}% câu sai · ${TIP[d]}</div></td><td>${n.length?n.map(r=>`<span class="chip">${esc(r.name)}</span>`).join(''):'—'}</td></tr>`}).join('')}</table></div>`;
const rank=`<div class="card wrap"><table><tr><th>#</th><th>TÊN</th><th>LỚP</th><th>CẤP</th><th>SAO</th><th>ẢI ĐẠT</th></tr>${fl.slice().sort((a,b)=>(b.stars||0)-(a.stars||0)||(b.xp||0)-(a.xp||0)).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}${r.all?' 🏆':''}</td><td>${esc(r.cls)}</td><td>${r.lv||Math.floor((r.xp||0)/100)+1}</td><td>⭐ ${r.stars||0}/15</td><td>${r.done||0}/4</td></tr>`).join('')}</table></div>`;
const weak=`<div class="card wrap"><table><tr><th>HỌC SINH</th><th>DẠNG YẾU NHẤT</th></tr>${fl.map(r=>{let b=0,m=0;[1,2,3,4,5].forEach(d=>{const w=r.wrong[d]||0,t=w+(r.right[d]||0),p=t?w/t:0;if(w&&(p>m||(p==m&&w>(r.wrong[b]||0)))){m=p;b=d}});return`<tr><td>${esc(r.name)} (${esc(r.cls)})</td><td>${b?DN[b]+' · '+Math.round(m*100)+'% sai':'Chưa có lỗi sai'}</td></tr>`}).join('')}</table></div>`;
$('#app').innerHTML=`<div class="row sp"><h1>👩‍🏫 Trang giáo viên</h1><div class="row">Lớp: <select onchange="CF=this.value;render()"><option value="">Tất cả</option>${CLS.map(c=>`<option ${c==CF?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn" onclick="load()">⬇ Tải kết quả</button><button class="btn o" onclick="csv()">Xuất CSV</button></div></div>
<div class="mut">${ST?`<span class="${ST[0]=='⚠'?'err':''}">${esc(ST)}</span>`:TT?'Cập nhật lúc '+TT:''} · <label><input type="checkbox" ${AUTO?'checked':''} onchange="setAuto(this.checked)"> tự làm mới mỗi 60 giây</label></div>
${cards}${cc}<h2>Tỉ lệ làm sai theo dạng bài</h2>${chart}<h2>Dạng cả lớp sai nhiều nhất</h2>${sup}<h2>Bảng xếp hạng</h2>${rank}<h2>Dạng yếu nhất từng người</h2>${weak}
<details ${url()?'':'open'}><summary><b>Cài đặt kết nối</b></summary><div class="card"><p class="mut">Đường dẫn Web App (Apps Script) và mật khẩu (đúng với MAT_KHAU trong Code.gs). Chỉ lưu trên máy này.</p><div class="row"><input id="gu" style="flex:1;min-width:240px" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(url())}"><input id="gp" type="password" placeholder="Mật khẩu" value="${esc(ld('gv_pw',''))}"><button class="btn" onclick="saveCfg()">Lưu và tải</button></div></div></details>`}
render();if(url())load();setAuto(AUTO);
</script></body></html>
