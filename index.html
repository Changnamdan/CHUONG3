<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vương Quốc Góc và Đường Thẳng Song Song</title>
<style>
:root{--bg:#fff3d6;--card:#fff;--ink:#2b2250;--pri:#6c4cf1;--ok:#1fa971;--bad:#e5484d;--line:#2b2250;--acc:#ffc233;--soft:#efe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1730;--card:#2a2447;--ink:#f3efff;--line:#9a8fe0;--soft:#3a3266;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1730;--card:#2a2447;--ink:#f3efff;--line:#9a8fe0;--soft:#3a3266;color-scheme:dark}
*{box-sizing:border-box}html{font-size:20px;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:1rem;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:14px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.85rem;padding:8px 12px}
.big{font-size:1.8rem}h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.3rem;margin:.2em 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.btn{font:inherit;background:var(--acc);color:#2b2250;border:3px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--line);font-weight:bold}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}.btn.go{background:var(--ok);color:#fff}.btn.sm{padding:4px 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--bad);color:#fff}.opt.hide{visibility:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{font-size:2rem;background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:4px;cursor:pointer;text-align:center}
.pick.on{background:var(--acc);color:#2b2250}.pick small{display:block;font-size:.6rem}
.prog{height:14px;background:var(--soft);border:2px solid var(--line);border-radius:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}
.fb{border-left:8px solid var(--ok)}.fb.bad{border-left-color:var(--bad)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:12px;padding:6px 10px}
.tabs button.on{background:var(--pri);color:#fff}.hbar{height:22px;background:var(--bad);border-radius:8px;color:#fff;font-size:.7rem;padding:0 6px;min-width:26px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:2px solid var(--soft);padding:4px 6px;text-align:left}.wrap{overflow-x:auto}
.lock{opacity:.5}.mut{font-size:.8rem;opacity:.8}
.fig{width:100%;max-width:340px;background:var(--soft);border:3px solid var(--line);border-radius:14px}
.num{font-size:2rem;text-align:center;border:3px solid var(--line);border-radius:14px;background:var(--soft);padding:6px;margin:8px auto;max-width:260px;min-height:3.2rem}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:8px auto}.kp .btn{font-size:1.2rem}
.chip{display:inline-block;background:var(--acc);color:#2b2250;border:3px solid var(--line);border-radius:12px;padding:6px 12px;margin:4px;cursor:grab;box-shadow:2px 2px 0 var(--line)}.chip.on{outline:4px solid var(--pri)}
.slot{flex:1;min-height:2.6rem;border:3px dashed var(--line);border-radius:12px;padding:6px 10px;background:var(--soft);cursor:pointer}.slot.ok{border-style:solid;background:var(--ok);color:#fff}.slot.no{border-style:solid;background:var(--bad);color:#fff}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.ml{flex:1 1 200px;font-weight:bold}.tfb.on{background:var(--pri);color:#fff}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);padding:8px 10px;margin:4px 0 10px}
.av{font-size:2rem;width:3rem;height:3rem;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);border-radius:50%;background:var(--soft)}
.hm{flex:1 1 120px;min-width:110px}.lv{color:var(--pri);font-weight:bold;font-size:.8rem}.hm small{font-size:.65rem;opacity:.8}
.xpb{height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}.xpb i{display:block;height:100%;background:var(--pri)}
.pill{border:3px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--card);font-weight:bold;font-size:.85rem}
.rb{font-size:1.1rem;border:3px solid var(--line);border-radius:50%;width:2.4rem;height:2.4rem;background:var(--card);cursor:pointer}
.owl{display:flex;gap:10px;align-items:center;margin:8px 0}.bub{flex:1;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 14px}
.mapc{background:linear-gradient(#e6f6e3,#cfeccf);border:3px solid var(--line);border-radius:26px;padding:6px;margin:10px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:3px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{background:none;border:0;font:inherit;font-size:.65rem;color:var(--ink);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:3px 8px;border-radius:12px}.nav .on{background:var(--acc);color:#2b2250}
body{padding-bottom:88px}.opt.sel{outline:4px solid var(--pri);background:#d9ceff;color:#2b2250}
.ov{position:fixed;inset:0;background:rgba(20,15,40,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}.mod{max-width:520px;width:100%;margin:0;text-align:center}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lvc{border:3px solid var(--line);border-radius:16px;padding:10px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--line);color:#2b2250}.lvc.g{background:#c8f3da}.lvc.y{background:#ffe7a8}
.toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);z-index:60;pointer-events:none;font-size:1.7rem;font-weight:bold;padding:14px 26px;border:4px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--line);animation:pop .35s ease-out;white-space:nowrap;color:#2b2250}
.toast.tg{background:#9be8b8}.toast.tb{background:#ffb3b3}@keyframes pop{from{transform:translateX(-50%) scale(.5);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.tc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.sc{border:3px solid var(--line);border-top:6px solid #0e6b60;border-radius:14px;padding:8px 12px;background:var(--card)}.sn{font-size:2rem}.sn small{font-size:1rem;font-weight:normal}
.gb{display:flex;align-items:center;gap:6px;margin:3px 0}.gb span{display:block;height:16px;border-radius:0 6px 6px 0}.gb b{font-size:.7rem}.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin:0 4px 0 8px}
.chipn{background:#ffe8b0;color:#6b4a00;border-radius:8px;padding:1px 8px;margin:2px;display:inline-block;font-size:.8rem}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const D=[{"n": 1, "lv": "Dễ", "q": "Cho hai góc kề bù xOy và yOz. Biết số đo góc xOy = 60°. Số đo góc yOz là:", "o": ["120°", "60°", "30°", "90°"], "c": 0, "e": "Vì góc xOy và góc yOz là hai góc kề bù nên tổng số đo của chúng bằng 180°: xOy + yOz = 180° ⇒ yOz = 180° - 60° = 120°."}, {"n": 2, "lv": "Dễ", "q": "Hai góc đối đỉnh có tính chất nổi bật nào sau đây?", "o": ["Bằng nhau", "Kề bù với nhau", "Có tổng bằng 90°", "Phụ nhau"], "c": 0, "e": "Theo định lí hai góc đối đỉnh: Hai góc đối đỉnh thì bằng nhau."}, {"n": 3, "lv": "Dễ", "q": "Cho hai góc A1 và A2 là hai góc đối đỉnh. Biết A1 = 45°. Số đo của góc A2 là:", "o": ["135°", "45°", "90°", "180°"], "c": 1, "e": "Vì A1 và A2 là hai góc đối đỉnh nên A2 = A1 = 45°."}, {"n": 4, "lv": "Dễ", "q": "Tia Ot được gọi là tia phân giác của góc xOy khi và chỉ khi:", "o": ["Ot nằm giữa Ox, Oy và xOt = tOy = 1/2 xOy", "Ot tạo với Ox một góc vuông", "Ot nằm ngoài góc xOy", "xOt + tOy = 180°"], "c": 0, "e": "Tia phân giác của một góc là tia nằm giữa hai cạnh của góc và tạo với hai cạnh ấy hai góc bằng nhau."}, {"n": 5, "lv": "Dễ", "q": "Cho góc xOy = 80°. Biết Ot là tia phân giác của góc xOy. Số đo góc xOt là:", "o": ["40°", "80°", "160°", "100°"], "c": 0, "e": "Vì Ot là tia phân giác của góc xOy nên xOt = xOy / 2 = 80° / 2 = 40°."}, {"n": 6, "lv": "Dễ", "q": "Hai góc vừa kề nhau vừa bù nhau được gọi là:", "o": ["Hai góc kề bù", "Hai góc đối đỉnh", "Hai góc so le trong", "Hai góc đồng vị"], "c": 0, "e": "Định nghĩa: Hai góc có một cạnh chung, hai cạnh còn lại là hai tia đối nhau gọi là hai góc kề bù."}, {"n": 7, "lv": "Dễ", "q": "Tổng số đo của hai góc kề bù luôn bằng bao nhiêu độ?", "o": ["180°", "90°", "360°", "120°"], "c": 0, "e": "Tính chất hai góc kề bù: Hai góc kề bù có tổng số đo bằng 180°."}, {"n": 8, "lv": "Dễ", "q": "Cho góc mOn = 110°. Góc đối đỉnh với góc mOn có số đo bằng bao nhiêu?", "o": ["110°", "70°", "90°", "220°"], "c": 0, "e": "Góc đối đỉnh với mOn luôn bằng góc mOn, do đó có số đo là 110°."}, {"n": 9, "lv": "Dễ", "q": "Hai đường thẳng xx' và yy' cắt nhau tại điểm O. Số cặp góc đối đỉnh (không tính góc bẹt) được tạo thành là:", "o": ["2 cặp", "4 cặp", "1 cặp", "3 cặp"], "c": 0, "e": "Khi hai đường thẳng cắt nhau tại 1 điểm, tạo thành 4 góc chung đỉnh. Có 2 cặp góc đối đỉnh không bẹt."}, {"n": 10, "lv": "Dễ", "q": "Cho góc aOb = 50°. Gọi Oc là tia đối của tia Oa, Od là tia đối của tia Ob. Số đo góc cOd bằng:", "o": ["50°", "130°", "100°", "40°"], "c": 0, "e": "Góc cOd và góc aOb là hai góc đối đỉnh (vì Oc đối Oa, Od đối Ob). Do đó cOd = aOb = 50°."}, {"n": 11, "lv": "Thường", "q": "Cho hai góc kề bù xOy và yOz sao cho số đo góc xOy bằng 2 lần số đo góc yOz. Số đo góc xOy là:", "o": ["120°", "60°", "90°", "100°"], "c": 0, "e": "Vì xOy và yOz kề bù nên xOy + yOz = 180°. Thay xOy = 2.yOz vào ta có: 2.yOz + yOz = 180° ⇒ 3.yOz = 180° ⇒ yOz = 60°. Suy ra xOy = 2 × 60° = 120°."}, {"n": 12, "lv": "Thường", "q": "Cho hai đường thẳng AB và CD cắt nhau tại O. Biết AOC + BOD = 100°. Số đo góc AOC là:", "o": ["50°", "100°", "130°", "80°"], "c": 0, "e": "Góc AOC và góc BOD là hai góc đối đỉnh nên AOC = BOD. Mà AOC + BOD = 100° ⇒ 2.AOC = 100° ⇒ AOC = 50°."}, {"n": 13, "lv": "Thường", "q": "Cho góc xOy = 120°. Vẽ tia phân giác Om của xOy, sau đó vẽ tia phân giác On của góc xOm. Số đo góc nOy là:", "o": ["90°", "60°", "30°", "75°"], "c": 0, "e": "Om là phân giác góc xOy (120°) ⇒ xOm = mOy = 60°. On là phân giác xOm (60°) ⇒ xOn = nOm = 30°. Góc nOy = nOm + mOy = 30° + 60° = 90°."}, {"n": 14, "lv": "Thường", "q": "Hai đường thẳng mn và pq cắt nhau tại I tạo thành góc mIp = 75°. Số đo góc mIq kề bù với góc mIp là:", "o": ["105°", "75°", "150°", "90°"], "c": 0, "e": "Vì mIp và mIq là hai góc kề bù nên: mIp + mIq = 180° ⇒ mIq = 180° - 75° = 105°."}, {"n": 15, "lv": "Thường", "q": "Cho hai góc kề bù AOB và BOC. Biết góc AOB lớn hơn góc BOC là 40°. Số đo góc AOB là:", "o": ["110°", "70°", "140°", "100°"], "c": 0, "e": "Ta có hệ phương trình góc: AOB + BOC = 180° và AOB - BOC = 40°. Cộng hai vế: 2.AOB = 220° ⇒ AOB = 110°."}, {"n": 16, "lv": "Thường", "q": "Cho hai góc kề nhau xOy = 40° và yOz = 50°. Tia Om là tia phân giác của góc xOz. Số đo góc mOy là:", "o": ["5°", "10°", "45°", "20°"], "c": 0, "e": "Góc xOz = xOy + yOz = 40° + 50° = 90°. Om là phân giác xOz ⇒ xOm = 90° / 2 = 45°. Góc mOy = xOm - xOy = 45° - 40° = 5°."}, {"n": 17, "lv": "Thường", "q": "Cho hai góc kề bù xOy và yOz. Tia Om là phân giác góc xOy, tia On là phân giác góc yOz. Số đo góc mOn là:", "o": ["90°", "180°", "45°", "60°"], "c": 0, "e": "Ta có mOn = mOy + yOn = (1/2)xOy + (1/2)yOz = (1/2)(xOy + yOz) = (1/2).180° = 90°. (Góc tạo bởi hai tia phân giác của hai góc kề bù luôn luôn vuông)."}, {"n": 18, "lv": "Thường", "q": "Cho 3 tia Ox, Oy, Oz chung gốc sao cho Ox và Oz là hai tia đối nhau, góc xOy = 130°. Tia Ou là tia phân giác của góc yOz. Số đo góc xOu là:", "o": ["155°", "25°", "130°", "140°"], "c": 0, "e": "Ox và Oz đối nhau ⇒ xOy và yOz kề bù ⇒ yOz = 180° - 130° = 50°. Ou phân giác yOz ⇒ yOu = 50° / 2 = 25°. Góc xOu = xOy + yOu = 130° + 25° = 155°."}, {"n": 19, "lv": "Thường", "q": "Cho hai đường thẳng xx' và yy' cắt nhau tại O. Tổng số đo 3 trong 4 góc tạo thành là 290°. Số đo góc nhỏ nhất tạo thành là:", "o": ["70°", "110°", "50°", "60°"], "c": 0, "e": "Tổng 4 góc đỉnh O là 360° ⇒ Góc thứ tư = 360° - 290° = 70°. Góc đối đỉnh với nó cũng bằng 70°. Hai góc kề bù còn lại có số đo 180° - 70° = 110°. Vậy góc nhỏ nhất có số đo là 70°."}, {"n": 20, "lv": "Thường", "q": "Cho góc xOy = 100°. Vẽ tia Oz nằm giữa Ox, Oy sao cho xOz = 30°. Vẽ tia Ot là tia phân giác của zOy. Số đo góc xOt là:", "o": ["65°", "35°", "70°", "50°"], "c": 0, "e": "Oz nằm giữa Ox, Oy ⇒ zOy = xOy - xOz = 100° - 30° = 70°. Ot là phân giác zOy ⇒ zOt = 70° / 2 = 35°. Tia Ot nằm giữa Ox và Oy ⇒ xOt = xOz + zOt = 30° + 35° = 65°."}, {"n": 21, "lv": "Dễ", "q": "Cho đường thẳng c cắt hai đường thẳng a và b. Nếu trong các góc tạo thành có một cặp góc so le trong bằng nhau thì:", "o": ["Đường thẳng a song song với b", "Đường thẳng a vuông góc với b", "Đường thẳng a trùng với b", "Đường thẳng a cắt b"], "c": 0, "e": "Dấu hiệu nhận biết hai đường thẳng song song: Nếu đường thẳng c cắt hai đường thẳng a, b và trong các góc tạo thành có một cặp góc so le trong bằng nhau thì a // b."}, {"n": 22, "lv": "Dễ", "q": "Cho đường thẳng c cắt hai đường thẳng song song a và b. Khẳng định nào sau đây là ĐÚNG?", "o": ["Hai góc đồng vị bằng nhau", "Hai góc trong cùng phía bằng nhau", "Hai góc so le trong bù nhau", "Hai góc đồng vị phụ nhau"], "c": 0, "e": "Tính chất của hai đường thẳng song song: Nếu một đường thẳng cắt hai đường thẳng song song thì hai góc đồng vị bằng nhau."}, {"n": 23, "lv": "Dễ", "q": "Cho a // b, góc A1 và góc B1 là hai góc ở vị trí đồng vị. Biết góc A1 = 60°. Số đo góc B1 là:", "o": ["60°", "120°", "30°", "90°"], "c": 0, "e": "Vì a // b nên các cặp góc đồng vị bằng nhau, suy ra B1 = A1 = 60°."}, {"n": 24, "lv": "Dễ", "q": "Hai đường thẳng phân biệt cùng vuông góc với đường thẳng thứ ba thì chúng có vị trí tương đối như thế nào?", "o": ["Song song với nhau", "Vuông góc với nhau", "Cắt nhau", "Trùng nhau"], "c": 0, "e": "Từ vuông góc đến song song: Hai đường thẳng phân biệt cùng vuông góc với đường thẳng thứ ba thì song song với nhau (a ⊥ c và b ⊥ c ⇒ a // b)."}, {"n": 25, "lv": "Dễ", "q": "Cho 3 đường thẳng a, b, c phân biệt. Nếu a // b và b // c thì:", "o": ["a // c", "a ⊥ c", "a cắt c", "a trùng c"], "c": 0, "e": "Tính chất 3 đường thẳng song song: Hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau."}, {"n": 26, "lv": "Dễ", "q": "Cho hai đường thẳng a // b và đường thẳng c vuông góc với a. Đường thẳng c có quan hệ thế nào với b?", "o": ["c vuông góc với b", "c song song với b", "c không cắt b", "c trùng b"], "c": 0, "e": "Tính chất: Một đường thẳng vuông góc với một trong hai đường thẳng song song thì nó cũng vuông góc với đường thẳng kia (a // b, c ⊥ a ⇒ c ⊥ b)."}, {"n": 27, "lv": "Dễ", "q": "Nếu đường thẳng c cắt hai đường thẳng a, b tạo thành một cặp góc trong cùng phía bù nhau thì:", "o": ["a // b", "a ⊥ b", "a cắt b", "a trùng b"], "c": 0, "e": "Dấu hiệu nhận biết hai đường thẳng song song: Hai góc trong cùng phía bù nhau thì hai đường thẳng song song."}, {"n": 28, "lv": "Dễ", "q": "Trong hình học phẳng, hai đường thẳng song song là hai đường thẳng:", "o": ["Không có điểm chung", "Có duy nhất 1 điểm chung", "Có vô số điểm chung", "Cắt nhau tại góc 90°"], "c": 0, "e": "Định nghĩa: Hai đường thẳng song song là hai đường thẳng không có điểm chung."}, {"n": 29, "lv": "Dễ", "q": "Cặp góc nằm ở miền trong hai đường thẳng và nằm khác phía đối với đường thẳng cắt gọi là:", "o": ["Cặp góc so le trong", "Cặp góc đồng vị", "Cặp góc trong cùng phía", "Cặp góc kề bù"], "c": 0, "e": "Định nghĩa vị trí góc: Miền trong và khác phía đường thẳng cắt là vị trí hai góc so le trong."}, {"n": 30, "lv": "Dễ", "q": "Cho A3 và B1 là hai góc so le trong tạo bởi đường thẳng c cắt a và b. Khi a // b thì:", "o": ["A3 = B1", "A3 + B1 = 180°", "A3 + B1 = 90°", "A3 = 2.B1"], "c": 0, "e": "Khi a // b thì hai góc so le trong bằng nhau (A3 = B1)."}, {"n": 31, "lv": "Thường", "q": "Cho đường thẳng c cắt a, b tại A, B. Biết góc so le trong A1 = 55°. Để a // b thì số đo góc so le trong B3 phải bằng:", "o": ["55°", "125°", "35°", "90°"], "c": 0, "e": "Để a // b thì hai góc so le trong phải bằng nhau: B3 = A1 = 55°."}, {"n": 32, "lv": "Thường", "q": "Cho a // b. Góc A2 và góc B2 là hai góc trong cùng phía. Biết A2 = 110°, tính số đo góc B2:", "o": ["70°", "110°", "180°", "80°"], "c": 0, "e": "Khi a // b, hai góc trong cùng phía bù nhau: A2 + B2 = 180° ⇒ B2 = 180° - 110° = 70°."}, {"n": 33, "lv": "Thường", "q": "Cho c cắt a, b. Biết góc đồng vị A1 = 120°, góc kề bù với góc B1 (đồng vị với A1) có số đo 60°. Khẳng định nào ĐÚNG?", "o": ["a // b", "a cắt b", "a ⊥ b", "a trùng b"], "c": 0, "e": "Góc kề bù với B1 bằng 60° ⇒ B1 = 180° - 60° = 120°. Do đó A1 = B1 = 120° (hai góc đồng vị bằng nhau) ⇒ a // b."}, {"n": 34, "lv": "Thường", "q": "Cho a ⊥ c và b ⊥ c. Nếu đường thẳng d cắt a tạo thành góc 45° thì d cắt b tạo thành góc so le trong bằng:", "o": ["45°", "135°", "90°", "60°"], "c": 0, "e": "Vì a ⊥ c và b ⊥ c nên a // b. Khi đường thẳng d cắt a, b thì hai góc so le trong bằng nhau, nên bằng 45°."}, {"n": 35, "lv": "Thường", "q": "Cho a // b. Góc so le trong A4 = 70°. Tính tổng số đo của cặp góc trong cùng phía A4 + B1:", "o": ["180°", "140°", "70°", "360°"], "c": 0, "e": "Với hai đường thẳng song song, hai góc trong cùng phía luôn có tổng số đo bằng 180°."}, {"n": 36, "lv": "Thường", "q": "Cho điểm M nằm ngoài đường thẳng d. Qua M vẽ đường thẳng a // d và đường thẳng b // d. Khẳng định nào sau đây ĐÚNG?", "o": ["a và b trùng nhau", "a và b vuông góc với nhau", "a và b cắt nhau tại M tạo góc 45°", "Không thể xác định"], "c": 0, "e": "Theo Tiên đề Euclid: Qua một điểm nằm ngoài đường thẳng chỉ vẽ được DUY NHẤT một đường thẳng song song với đường thẳng đó. Do đó a và b trùng nhau."}, {"n": 37, "lv": "Thường", "q": "Cho tam giác ABC. Qua đỉnh A vẽ đường thẳng x'Ax // BC. Số đo góc xAB bằng góc nào của tam giác ABC?", "o": ["Góc ABC", "Góc ACB", "Góc BAC", "Không bằng góc nào"], "c": 0, "e": "Vì đường thẳng Ax // BC nên góc xAB và góc ABC là hai góc so le trong ⇒ xAB = ABC."}, {"n": 38, "lv": "Thường", "q": "Cho a // b. Một đường thẳng c cắt a, b tại M, N. Biết M1 - N1 = 40° (với M1, N1 là 2 góc trong cùng phía). Số đo góc M1 là:", "o": ["110°", "70°", "140°", "100°"], "c": 0, "e": "Vì a // b nên hai góc trong cùng phía bù nhau: M1 + N1 = 180°. Kết hợp M1 - N1 = 40° ⇒ 2.M1 = 220° ⇒ M1 = 110°."}, {"n": 39, "lv": "Thường", "q": "Cho hình chữ nhật ABCD. Khẳng định nào sau đây về các cạnh của hình chữ nhật là SAI?", "o": ["AB ⊥ CD", "AB // CD", "AD // BC", "AB ⊥ BC"], "c": 0, "e": "Trong hình chữ nhật ABCD, hai cạnh đối AB và CD song song với nhau (AB // CD), không vuông góc với nhau."}, {"n": 40, "lv": "Thường", "q": "Cho a // b. Vẽ c ⊥ a tại P. Đường thẳng d vuông góc với b tại Q. Vị trí tương đối giữa c và d là:", "o": ["c // d hoặc c trùng d", "c ⊥ d", "c cắt d tạo góc 45°", "c và d chéo nhau"], "c": 0, "e": "Vì a // b và c ⊥ a ⇒ c ⊥ b. Lại có d ⊥ b. Do đó c và d cùng vuông góc với b ⇒ c // d (hoặc c trùng d)."}, {"n": 41, "lv": "Dễ", "q": "Tiên đề Euclid về đường thẳng song song phát biểu rằng: Qua một điểm ở ngoài một đường thẳng:", "o": ["Chỉ có một đường thẳng song song với đường thẳng đó", "Có ít nhất hai đường thẳng song song với đường thẳng đó", "Có vô số đường thẳng song song với đường thẳng đó", "Không có đường thẳng nào song song với đường thẳng đó"], "c": 0, "e": "Nội dung Tiên đề Euclid: Qua một điểm ở ngoài một đường thẳng chỉ có một đường thẳng song song với đường thẳng đó."}, {"n": 42, "lv": "Dễ", "q": "Cho a // b. Nếu góc A1 = 50° (vị trí đồng vị với B1) thì số đo góc B1 bằng bao nhiêu?", "o": ["50°", "130°", "40°", "100°"], "c": 0, "e": "Hai đường thẳng song song thì các cặp góc đồng vị bằng nhau ⇒ B1 = A1 = 50°."}, {"n": 43, "lv": "Dễ", "q": "Cho hai đường thẳng a // b. Nếu góc M2 = 135° thì góc so le trong với nó (góc N4) có số đo bằng:", "o": ["135°", "45°", "90°", "180°"], "c": 0, "e": "Vì a // b nên hai góc so le trong bằng nhau ⇒ N4 = M2 = 135°."}, {"n": 44, "lv": "Dễ", "q": "Cho a // b và góc trong cùng phía P1 = 80°. Góc trong cùng phía Q2 còn lại có số đo bằng:", "o": ["100°", "80°", "180°", "20°"], "c": 0, "e": "Hai góc trong cùng phía bù nhau: P1 + Q2 = 180° ⇒ Q2 = 180° - 80° = 100°."}, {"n": 45, "lv": "Dễ", "q": "Cho x // y. Biết góc A = 75°. Số đo góc kề bù với góc so le trong của góc A là:", "o": ["105°", "75°", "150°", "90°"], "c": 0, "e": "Góc so le trong với A bằng 75°. Góc kề bù với nó có số đo: 180° - 75° = 105°."}, {"n": 46, "lv": "Dễ", "q": "Phát biểu nào sau đây thể hiện ĐÚNG nội dung Tiên đề Euclid?", "o": ["Qua điểm A ngoài đường thẳng m, chỉ vẽ được duy nhất 1 đường thẳng song song với m", "Qua điểm A trên đường thẳng m, vẽ được duy nhất 1 đường thẳng song song với m", "Qua điểm A ngoài đường thẳng m, vẽ được vô số đường thẳng song song với m", "Hai đường thẳng song song thì không bao giờ cắt nhau"], "c": 0, "e": "Đáp án A nêu đúng điều kiện nằm ngoài và tính duy nhất của đường thẳng song song theo Tiên đề Euclid."}, {"n": 47, "lv": "Dễ", "q": "Cho a // b và đường thẳng c cắt a, b. Tổng số đo của hai góc so le trong bằng 140°. Số đo mỗi góc so le trong đó là:", "o": ["70°", "140°", "35°", "110°"], "c": 0, "e": "Vì a // b nên hai góc so le trong bằng nhau. Tổng bằng 140° ⇒ Mỗi góc bằng 140° / 2 = 70°."}, {"n": 48, "lv": "Dễ", "q": "Cho a // b. Biết góc đối đỉnh với góc đồng vị của góc X1 có số đo 40°. Hỏi số đo góc X1 bằng:", "o": ["40°", "140°", "80°", "50°"], "c": 0, "e": "Góc đồng vị với X1 bằng X1 (do a // b). Góc đối đỉnh với góc đồng vị lại bằng góc đồng vị. Do đó X1 = 40°."}, {"n": 49, "lv": "Dễ", "q": "Cho 4 đường thẳng a, b, c, d phân biệt. Nếu a // b, b // c, c // d thì mối quan hệ giữa a và d là:", "o": ["a // d", "a ⊥ d", "a cắt d", "a trùng d"], "c": 0, "e": "Áp dụng tính chất bắc cầu của đường thẳng song song: a // b // c // d ⇒ a // d."}, {"n": 50, "lv": "Dễ", "q": "Cho hai đường thẳng song song m và n. Nếu đường thẳng t cắt đường thẳng m thì đường thẳng t:", "o": ["Cắt đường thẳng n", "Song song với n", "Không bao giờ gặp n", "Trùng với n"], "c": 0, "e": "Hệ quả tiên đề Euclid: Nếu một đường thẳng cắt một trong hai đường thẳng song song thì nó cũng cắt đường thẳng còn lại."}, {"n": 51, "lv": "Thường", "q": "Cho hình vẽ có Ax // Cy (hai tia Ax, Cy cùng hướng), điểm B nằm giữa hai đường thẳng đó. Biết xAB = 40°, BCy = 30°. Số đo góc ABC bằng:", "o": ["70°", "10°", "110°", "120°"], "c": 0, "e": "Kẻ tia Bt // Ax (Bt nằm trong góc ABC). Vì Ax // Cy nên Bt // Cy. Khi đó ABt = xAB = 40° (so le trong) và tBC = BCy = 30° (so le trong). Góc ABC = ABt + tBC = 40° + 30° = 70°."}, {"n": 52, "lv": "Thường", "q": "Cho a // b. Tia Ax là phân giác góc so le trong A1, tia By là phân giác góc so le trong B1. Vị trí tương đối của Ax và By là:", "o": ["Ax // By", "Ax ⊥ By", "Ax cắt By", "Ax trùng By"], "c": 0, "e": "A1 = B1 ⇒ (1/2)A1 = (1/2)B1 ⇒ Hai góc tạo bởi hai tia phân giác bằng nhau ở vị trí so le trong ⇒ Ax // By."}, {"n": 53, "lv": "Thường", "q": "Cho hai đường thẳng x // y (xem hình), A thuộc x, B thuộc y, điểm O nằm giữa x và y. Biết xAO = 120°, yBO = 140°. Số đo góc AOB là:", "o": ["100°", "80°", "120°", "60°"], "c": 0, "e": "Kẻ Ot // x qua O (Ot nằm trong góc AOB) ⇒ Ot // y. Vì Ot // x nên xAO + AOt = 180° (trong cùng phía) ⇒ AOt = 180° - 120° = 60°. Vì Ot // y nên yBO + BOt = 180° (trong cùng phía) ⇒ BOt = 180° - 140° = 40°. Vì Ot nằm giữa OA và OB nên AOB = AOt + BOt = 60° + 40° = 100°."}, {"n": 54, "lv": "Thường", "q": "Cho a // b. Góc A1 kề bù với góc so le trong. Nếu A1 = 65°, số đo góc so le trong tương ứng là:", "o": ["115°", "65°", "25°", "125°"], "c": 0, "e": "Góc so le trong kề bù với A1 có số đo: 180° - 65° = 115°."}, {"n": 55, "lv": "Thường", "q": "Cho m // n. Biết tại đỉnh A có A1 = 2.A2 (với A1, A2 kề bù). Số đo góc đồng vị với A1 tại đỉnh B là:", "o": ["120°", "60°", "90°", "150°"], "c": 0, "e": "A1 + A2 = 180° ⇒ 2.A2 + A2 = 180° ⇒ 3.A2 = 180° ⇒ A2 = 60° ⇒ A1 = 120°. Vì m // n nên góc đồng vị với A1 tại đỉnh B cũng bằng 120°."}, {"n": 56, "lv": "Thường", "q": "Cho a // b. Đường thẳng c vuông góc với a. Tia phân giác n của góc tạo bởi c và b tạo với b một góc bằng:", "o": ["45°", "90°", "30°", "60°"], "c": 0, "e": "Vì a // b và c ⊥ a ⇒ c ⊥ b ⇒ Góc giữa c và b là 90°. Tia phân giác n chia góc vuông này thành hai góc 45°."}, {"n": 57, "lv": "Thường", "q": "Cho góc xOy = 60°. Lấy điểm A trên Ox. Qua A vẽ đường thẳng a // Oy. Số đo góc tù tạo bởi a và tia Ox là:", "o": ["120°", "60°", "150°", "100°"], "c": 0, "e": "Vì a // Oy nên góc trong cùng phía với xOy có số đo: 180° - 60° = 120° (đây là góc tù cần tìm)."}, {"n": 58, "lv": "Thường", "q": "Cho u // v. Đường thẳng t cắt u, v tại E, F. Các tia phân giác của hai góc trong cùng phía cắt nhau tại I. Số đo góc EIF là:", "o": ["90°", "180°", "60°", "120°"], "c": 0, "e": "Tổng hai góc trong cùng phía bằng 180°. Tổng hai góc nửa tương ứng trong tam giác EIF = (1/2).180° = 90°. Suy ra góc EIF = 180° - 90° = 90°."}, {"n": 59, "lv": "Thường", "q": "Cho 3 đường thẳng song song a // b // c. Khoảng cách từ a đến b là 3cm, từ b đến c là 4cm (b nằm giữa a và c). Khoảng cách từ a đến c là:", "o": ["7 cm", "1 cm", "12 cm", "5 cm"], "c": 0, "e": "Vì b nằm giữa a và c nên khoảng cách từ a đến c bằng tổng hai khoảng cách: 3 + 4 = 7 cm."}, {"n": 60, "lv": "Thường", "q": "Cho tam giác ABC. Qua B kẻ đường thẳng song song AC, qua C kẻ đường thẳng song song AB, chúng cắt nhau tại D. So sánh BAC và BDC:", "o": ["BAC = BDC", "BAC > BDC", "BAC < BDC", "BAC + BDC = 90°"], "c": 0, "e": "Tứ giác ABDC có các cạnh đối song song (hình bình hành) ⇒ Các góc đối bằng nhau: BAC = BDC."}, {"n": 61, "lv": "Dễ", "q": "Trong Toán học, một định lí được định nghĩa là:", "o": ["Một khẳng định được suy ra từ những khẳng định đúng thông qua chứng minh", "Một hình vẽ minh họa cho khái niệm", "Một phép đo độ dài chính xác", "Một câu hỏi bài tập cần giải"], "c": 0, "e": "Định nghĩa định lí: Định lí là một khẳng định được suy ra từ những khẳng định được coi là đúng thông qua lập luận, chứng minh."}, {"n": 62, "lv": "Dễ", "q": "Một định lí toán học thông thường gồm có hai phần chính là:", "o": ["Giả thiết và Kết luận", "Mở bài và Kết bài", "Đề bài và Đáp án", "Hình vẽ và Lời giải"], "c": 0, "e": "Cấu trúc định lí: Định lí gồm hai phần là Giả thiết (GT) và Kết luận (KL)."}, {"n": 63, "lv": "Dễ", "q": "Giả thiết (GT) của một định lí là:", "o": ["Những điều đã cho biết trước", "Những điều cần phải chứng minh", "Kết quả cuối cùng của bài toán", "Tên gọi của định lí"], "c": 0, "e": "Giả thiết là những điều đã cho (cho biết trước) trong phát biểu định lí."}, {"n": 64, "lv": "Dễ", "q": "Kết luận (KL) của một định lí là:", "o": ["Những điều cần suy ra từ giả thiết", "Những điều đã biết trước", "Phép tính trung gian", "Tên tác giả phát minh định lí"], "c": 0, "e": "Kết luận là điều cần suy ra (cần chứng minh) từ những điều đã cho trong giả thiết."}, {"n": 65, "lv": "Dễ", "q": "Định lí thường phát biểu dưới dạng 'Nếu A thì B'. Phần A đóng vai trò là:", "o": ["Giả thiết", "Kết luận", "Chứng minh", "Tiên đề"], "c": 0, "e": "Trong dạng phát biểu 'Nếu A thì B': Phần nằm giữa từ 'Nếu' và từ 'thì' (phần A) là Giả thiết."}, {"n": 66, "lv": "Dễ", "q": "Định lí phát biểu dưới dạng 'Nếu A thì B'. Phần B đóng vai trò là:", "o": ["Kết luận", "Giả thiết", "Hình vẽ", "Giả định"], "c": 0, "e": "Trong dạng phát biểu 'Nếu A thì B': Phần nằm sau từ 'thì' (phần B) là Kết luận."}, {"n": 67, "lv": "Dễ", "q": "Cho định lí: 'Nếu hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì chúng song song với nhau.' Giả thiết là:", "o": ["a // c và b // c (a, b, c phân biệt)", "a // b", "a ⊥ c và b ⊥ c", "a, b, c cắt nhau tại 1 điểm"], "c": 0, "e": "Phần sau từ 'Nếu' và trước từ 'thì' là: hai đường thẳng phân biệt cùng song song đường thứ ba (a // c, b // c)."}, {"n": 68, "lv": "Dễ", "q": "Cho định lí: 'Hai góc đối đỉnh thì bằng nhau.' Kết luận của định lí này là:", "o": ["Hai góc đó bằng nhau", "Hai góc đó có chung đỉnh", "Hai góc đó kề bù nhau", "Hai góc đó có tổng bằng 180°"], "c": 0, "e": "Viết lại dưới dạng 'Nếu 2 góc đối đỉnh thì 2 góc đó bằng nhau' ⇒ Kết luận là hai góc đó bằng nhau."}, {"n": 69, "lv": "Dễ", "q": "Chứng minh định lí là quá trình:", "o": ["Dùng suy luận để từ Giả thiết suy ra Kết luận", "Dùng thước đo góc để kiểm tra kết quả", "Vẽ hình thật chính xác bằng máy tính", "Nhìn mắt thường để khẳng định"], "c": 0, "e": "Chứng minh định lí là dùng lập luận toán học để từ Giả thiết rút ra Kết luận một cách logic."}, {"n": 70, "lv": "Dễ", "q": "Khi trình bày Giả thiết và Kết luận của một định lí hình học, người ta thường dùng:", "o": ["Ký hiệu toán học kết hợp hình vẽ minh họa", "Đoạn văn xuôi dài", "Bảng số liệu thống kê", "Biểu đồ hình tròn"], "c": 0, "e": "Quy cách chuẩn: Dùng hình vẽ minh họa và các ký hiệu toán học ngắn gọn để tóm tắt GT và KL."}, {"n": 71, "lv": "Thường", "q": "Cho định lí: 'Một đường thẳng vuông góc với một trong hai đường thẳng song song thì nó cũng vuông góc với đường thẳng còn lại.' Gọi hai đường thẳng song song là a, b và đường thẳng đã cho vuông góc là c ⊥ a. Ký hiệu GT đúng là:", "o": ["a // b, c ⊥ a", "a // b, c // a", "a ⊥ b, c ⊥ a", "c ⊥ a, c ⊥ b"], "c": 0, "e": "Giả thiết là cho trước hai đường thẳng song song (a // b) và một đường thẳng vuông góc với một trong hai đường đó (c ⊥ a). Còn c ⊥ b là kết luận của định lí, không phải giả thiết."}, {"n": 72, "lv": "Thường", "q": "Cho 3 bước chứng minh: (1) Suy ra A1 = B1 (so le trong); (2) Cho a // b; (3) Đường thẳng c cắt a, b. Sắp xếp thứ tự logic đúng là:", "o": ["(2) → (3) → (1)", "(1) → (2) → (3)", "(3) → (1) → (2)", "(2) → (1) → (3)"], "c": 0, "e": "Trình tự suy luận: Cho 2 đường song song (2), có đường thẳng c cắt hai đường thẳng đó (3), suy ra hai góc so le trong bằng nhau (1)."}, {"n": 73, "lv": "Thường", "q": "Cho định lí: 'Hai tia phân giác của hai góc kề bù thì vuông góc với nhau.' Viết ký hiệu Kết luận (KL) đúng là:", "o": ["Om ⊥ On", "Om // On", "mOn = 180°", "Om trùng On"], "c": 0, "e": "Gọi Om, On lần lượt là tia phân giác của hai góc kề bù. Điều cần chứng minh (Kết luận) là Om ⊥ On."}, {"n": 74, "lv": "Thường", "q": "Điền vào dấu (...) để hoàn thành khẳng định: 'Nếu a // b và c ⊥ a thì ......'", "o": ["c ⊥ b", "c // b", "c trùng b", "c cắt b góc 45°"], "c": 0, "e": "Từ tính chất quan hệ giữa tính vuông góc và tính song song: a // b, c ⊥ a ⇒ c ⊥ b."}, {"n": 75, "lv": "Thường", "q": "Khẳng định: 'Nếu góc A và góc B là hai góc kề bù thì A + B = 180°.' Đây là phát biểu về:", "o": ["Tính chất của hai góc kề bù (Định lí/Định nghĩa)", "Tiên đề Euclid", "Giả thuyết chưa chứng minh", "Định lí Pythagore"], "c": 0, "e": "Đây là khẳng định về tính chất số đo của hai góc kề bù được chứng minh trong chương trình."}, {"n": 76, "lv": "Thường", "q": "Cho sơ đồ suy luận: a ⊥ c và b ⊥ c ⇒ (...?) ⇒ A1 = B1 (so le trong). Khẳng định cần điền vào (...?) là:",
